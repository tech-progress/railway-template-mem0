name: railway-mem0-template

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U mem0"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mem0-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "8000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_COLLECTION_NAME: memories
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      AUTH_DISABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DASHBOARD_URL: ${MEM0_DASHBOARD_URL:-http://127.0.0.1:3000}
      MEM0_DEFAULT_LLM_MODEL: gpt-4.1-nano-2025-04-14
      MEM0_DEFAULT_EMBEDDER_MODEL: text-embedding-3-small
      MEM0_TELEMETRY: "false"
      REQUEST_LOG_RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    ports:
      - "8888:8000"
    volumes:
      - mem0-history:/app/history

  mem0-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${MEM0_API_URL:-http://127.0.0.1:8888}
      API_INTERNAL_URL: http://mem0-api:8000
      NEXT_PUBLIC_INSTANCE_NAME: Mem0
    depends_on:
      mem0-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "3000:3000"

  mock-openai:
    profiles: [test]
    image: railway-mem0-template-mem0-api
    command: ["python", "./scripts/mock-openai.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
  mem0-history:
